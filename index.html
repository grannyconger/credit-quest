<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Quest</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Boogaloo&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens.css">
</head>
<body>

  <!-- ── Persistent Header ───────────────────────────────────────────────── -->
  <header id="game-header">
    <div id="header-left">
      <div id="char-avatar-wrap">
        <div id="char-avatar">⭐</div>
      </div>
      <div id="char-info">
        <div id="char-name" class="orbitron">—</div>
        <div id="player-name-display"></div>
        <div id="char-age"></div>
      </div>
    </div>

    <div id="header-center">
      <div id="stage-indicator">
        <span class="stage-dot" title="Stage 1: High School"></span>
        <span class="stage-dot" title="Stage 2: College"></span>
        <span class="stage-dot" title="Stage 3: Young Adult"></span>
      </div>
    </div>

    <div id="header-right">
      <div id="score-display" title="Click to see your full credit score breakdown">
        <div class="score-row">
          <span class="orbitron" id="score-number">—</span>
          <span id="score-trend"></span>
          <span id="score-delta" class="score-delta neutral"></span>
        </div>
        <div id="score-tier">No Score Yet</div>
        <div id="score-label">SCORE ▾</div>
      </div>

      <div id="fico-bar">
        <div class="fico-segment poor"  title="Payment History (35%)"></div>
        <div class="fico-segment poor"  title="Amounts Owed (30%)"></div>
        <div class="fico-segment poor"  title="Length of History (15%)"></div>
        <div class="fico-segment poor"  title="Credit Mix (10%)"></div>
        <div class="fico-segment poor"  title="New Credit (10%)"></div>
      </div>

      <button id="mute-btn" title="Mute sounds">🔊</button>
    </div>
  </header>

  <!-- ── Main Stage Container ────────────────────────────────────────────── -->
  <main id="stage-container">
    <!-- Populated by main.js -->
  </main>

  <!-- ── Score Modal ─────────────────────────────────────────────────────── -->
  <div id="modal-overlay">
    <div id="score-modal" class="score-modal">
      <!-- Populated by openScoreModal() -->
    </div>
  </div>

  <!-- ── Scripts (ES modules; see scripts/main.js for the layout) ───────────── -->
  <script type="module" src="scripts/main.js"></script>

</body>
</html>
